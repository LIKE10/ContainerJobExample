# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: containerjobexample

infra:
  provider: bicep
  path: infra/azd
  module: main

# Container App Jobs aren't an azd service host, so images are built
# and rolled out to the jobs in the postprovision hook.
hooks:
  postprovision:
    posix:
      shell: sh
      run: scripts/hooks/postprovision.sh
    windows:
      shell: pwsh
      run: scripts/hooks/postprovision.ps1
