name: Build, Containerize, and Deploy

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  MANUAL_PROJECT_PATH: 'src/ManualExample/ManualExample.csproj'
  SCHEDULED_PROJECT_PATH: 'src/ScheduledExample/ScheduledExample.csproj'
  PUBLISH_OUTPUT_MANUAL: './publish-manual'
  PUBLISH_OUTPUT_SCHEDULED: './publish-scheduled'
  MANUAL_IMAGE_NAME: 'manualexample'
  SCHEDULED_IMAGE_NAME: 'scheduledexample'

jobs:
  # ── Step 1: Build ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies (ManualExample)
        run: dotnet restore ${{ env.MANUAL_PROJECT_PATH }}

      - name: Restore dependencies (ScheduledExample)
        run: dotnet restore ${{ env.SCHEDULED_PROJECT_PATH }}

      - name: Publish ManualExample
        run: |
          dotnet publish ${{ env.MANUAL_PROJECT_PATH }} \
            --configuration Release \
            --no-restore \
            --output ${{ env.PUBLISH_OUTPUT_MANUAL }}

      - name: Publish ScheduledExample
        run: |
          dotnet publish ${{ env.SCHEDULED_PROJECT_PATH }} \
            --configuration Release \
            --no-restore \
            --output ${{ env.PUBLISH_OUTPUT_SCHEDULED }}

      - name: Upload ManualExample artifact
        uses: actions/upload-artifact@v5
        with:
          name: publish-manual
          path: ${{ env.PUBLISH_OUTPUT_MANUAL }}

      - name: Upload ScheduledExample artifact
        uses: actions/upload-artifact@v5
        with:
          name: publish-scheduled
          path: ${{ env.PUBLISH_OUTPUT_SCHEDULED }}

  # ── Step 2: Containerize ─────────────────────────────────────────────────────
  containerize:
    name: Containerize
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Build ManualExample Docker image
        run: |
          docker build \
            --tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.MANUAL_IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            src/ManualExample

      - name: Build ScheduledExample Docker image
        run: |
          docker build \
            --tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.SCHEDULED_IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            src/ScheduledExample

      - name: Save ManualExample Docker image as artifact
        run: |
          docker save \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.MANUAL_IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            | gzip > image-manual.tar.gz

      - name: Save ScheduledExample Docker image as artifact
        run: |
          docker save \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.SCHEDULED_IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            | gzip > image-scheduled.tar.gz

      - name: Upload ManualExample Docker image artifact
        uses: actions/upload-artifact@v5
        with:
          name: docker-image-manual
          path: image-manual.tar.gz

      - name: Upload ScheduledExample Docker image artifact
        uses: actions/upload-artifact@v5
        with:
          name: docker-image-scheduled
          path: image-scheduled.tar.gz

  # ── Step 3: Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: containerize
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download ManualExample Docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: docker-image-manual

      - name: Download ScheduledExample Docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: docker-image-scheduled
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Load and push ManualExample Docker image to ACR
        run: |
          docker load < image-manual.tar.gz
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.MANUAL_IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}

      - name: Load and push ScheduledExample Docker image to ACR
        run: |
          docker load < image-scheduled.tar.gz
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.SCHEDULED_IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}

      - name: Deploy Bicep Container Jobs
        run: |
          az deployment group create \  
            --resource-group '${{ secrets.AZURE_RESOURCE_GROUP }}' \
            --template-file infra/container-job.bicep \
            --parameters infra/container-job.bicepparam \
            --parameters containerImage='${{ secrets.ACR_LOGIN_SERVER }}/${{ env.MANUAL_IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}' \
            --parameters jobName='manualcontainer-job' \
            --parameters containerName='manualcontainer' 

          az deployment group create \  
            --resource-group '${{ secrets.AZURE_RESOURCE_GROUP }}' \
            --template-file infra/container-job.bicep \
            --parameters infra/container-job.bicepparam \
            --parameters containerImage='${{ secrets.ACR_LOGIN_SERVER }}/${{ env.SCHEDULED_IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}' \
            --parameters jobName='scheduledcontainer-job' \
            --parameters containerName='scheduledcontainer' 

      - name: Update ManualExample Container App Job image
        run: |
          az containerapp job update \
            --name 'manualcontainer-job' \
            --resource-group '${{ secrets.AZURE_RESOURCE_GROUP }}' \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.MANUAL_IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}"

      - name: Update ScheduledExample Container App Job image
        run: |
          az containerapp job update \
            --name 'scheduledcontainer-job' \
            --resource-group '${{ secrets.AZURE_RESOURCE_GROUP }}' \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.SCHEDULED_IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}"
