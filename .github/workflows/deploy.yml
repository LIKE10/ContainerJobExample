name: Build, Containerize, and Deploy

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/ContainerJob/ContainerJob.csproj'
  PUBLISH_OUTPUT: './publish'
  IMAGE_NAME: 'containerjob'

jobs:
  # ── Step 1: Build ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish application
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-restore \
            --output ${{ env.PUBLISH_OUTPUT }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ${{ env.PUBLISH_OUTPUT }}

  # ── Step 2: Containerize ─────────────────────────────────────────────────────
  containerize:
    name: Containerize
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            --file Dockerfile \
            .

      - name: Save Docker image as artifact
        run: |
          docker save \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            | gzip > image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  # ── Step 3: Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: containerize
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Load and push Docker image to ACR
        run: |
          docker load < image.tar.gz
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}

      - name: Deploy Bicep infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters \
                appName="${{ secrets.APP_NAME }}" \
                location="${{ secrets.AZURE_LOCATION }}" \
                containerImage="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}" \
                containerRegistryServer="${{ secrets.ACR_LOGIN_SERVER }}" \
                containerRegistryUsername="${{ secrets.ACR_USERNAME }}" \
                containerRegistryPassword="${{ secrets.ACR_PASSWORD }}"

      - name: Update Container App Job image
        run: |
          az containerapp job update \
            --name "${{ secrets.APP_NAME }}-job" \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.containerize.outputs.image_tag }}"
